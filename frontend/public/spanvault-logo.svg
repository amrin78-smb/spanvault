<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 46" role="img" aria-label="SpanVault">
  <!-- Mark: a telemetry waveform as solid bars (was a 2.5px polyline that
       thinned out at sidebar size). -->
  <g fill="#16a34a">
    <rect x="2"  y="18" width="5" height="10" rx="2.5" opacity="0.55"/>
    <rect x="10" y="12" width="5" height="22" rx="2.5" opacity="0.75"/>
    <rect x="18" y="4"  width="5" height="38" rx="2.5"/>
    <rect x="26" y="10" width="5" height="26" rx="2.5" opacity="0.85"/>
    <rect x="34" y="16" width="5" height="14" rx="2.5" opacity="0.65"/>
  </g>
  <text x="50" y="30" font-size="26" font-weight="700" letter-spacing="-0.3" font-family="'Rubik','Helvetica Neue',Helvetica,Arial,sans-serif"><tspan fill="#ffffff">Span</tspan><tspan fill="#16a34a">Vault</tspan></text>
</svg>
